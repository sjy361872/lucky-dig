<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬롯 체험 (프로토타입)</title>
<style>
  :root { --gold: #ffd34a; --bg: #2a1808; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #120a03 url(assets/ui/bg.jpg) center/cover; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #fff; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 440px; padding: 14px 16px 30px; position: relative; overflow: hidden; }
  h1 { font-size: 18px; text-align: center; margin: 4px 0 2px; text-shadow: 0 2px 0 #000; }
  .sub { text-align: center; font-size: 12px; opacity: .85; margin-bottom: 10px; text-shadow: 0 1px 0 #000; }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .modes button { flex: 1; padding: 10px 4px; border-radius: 12px; border: 2px solid #000; font-weight: 900; font-size: 14px; background: #4a2c0e; color: #ffe9b0; }
  .modes button.on { background: linear-gradient(#ffd34a, #e08a00); color: #3a1a00; }
  #stage { position: relative; border-radius: 18px; background: linear-gradient(#6b4318, #3a220a); border: 3px solid #1a0f05; padding: 18px 10px 14px; box-shadow: 0 8px 20px rgba(0,0,0,.6); }
  #dim { position: absolute; inset: 0; border-radius: 16px; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #stage.tense #dim { opacity: 1; }
  #counter { position: relative; z-index: 2; text-align: center; min-height: 62px; }
  #counter b { display: inline-block; font-size: 40px; font-weight: 900; color: var(--gold); -webkit-text-stroke: 1.5px #6b1a00; text-shadow: 0 3px 0 #000; transition: font-size .15s; }
  #counter small { display: block; font-size: 13px; font-weight: 800; color: #ffe9b0; min-height: 18px; text-shadow: 0 1px 0 #000; }
  #counter.big b { font-size: 56px; }
  #counter.huge b { font-size: 70px; color: #fff3a0; }
  #reels { position: relative; z-index: 2; display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .reel { position: relative; width: 72px; height: 80px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #fff7ea, #e2c393); border: 3px solid #c9a26a; box-shadow: inset 0 3px 6px rgba(120,80,30,.35), 0 3px 0 #2a1a0c; display: flex; align-items: center; justify-content: center; }
  .reel img { width: 54px; height: 54px; object-fit: contain; }
  .reel.spin img { filter: blur(2px); opacity: .8; transform: translateY(4px); }
  .reel.slow { border-color: #ff5a5a; box-shadow: 0 0 18px #ff5a5a, inset 0 0 10px rgba(255,90,90,.5); animation: pulse .35s ease-in-out infinite alternate; }
  .reel.line { border-color: #4fe0ff; box-shadow: 0 0 16px #4fe0ff; }
  .reel.gold.line { border-color: var(--gold); box-shadow: 0 0 22px var(--gold), inset 0 0 12px var(--gold); }
  .reel .tag { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 900; color: #fff; background: #2a1a0c; border: 2px solid var(--gold); border-radius: 8px; padding: 0 6px; }
  .reel .tag.mult { background: #b0201a; border-color: #ffb0a0; }
  @keyframes pulse { to { transform: scale(1.06); } }
  #line { position: relative; z-index: 2; text-align: center; height: 34px; margin-top: 10px; font-size: 22px; font-weight: 900; color: #7ff7ff; text-shadow: 0 2px 0 #000; }
  #line.gold { color: var(--gold); font-size: 28px; }
  .fly { position: absolute; z-index: 5; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 #000; pointer-events: none; }
  .fly.mult { color: #ff8a7a; font-size: 22px; }
  .ctrl { display: flex; gap: 8px; margin-top: 12px; }
  .ctrl button { flex: 1; padding: 14px 0; border: 0; border-radius: 14px; font-size: 17px; font-weight: 900; background: linear-gradient(#ffd34a, #e08a00); color: #3a1a00; box-shadow: 0 4px 0 #8a4a00; }
  .ctrl button.ghost { flex: .6; background: #4a2c0e; color: #ffe9b0; box-shadow: 0 4px 0 #1a0f05; font-size: 14px; }
  .ctrl button.ghost.on { background: #2f7a2a; }
  .ctrl button:disabled { opacity: .5; }
  #stats { margin-top: 10px; font-size: 12px; text-align: center; opacity: .9; text-shadow: 0 1px 0 #000; }
  .rules { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.55); font-size: 12.5px; line-height: 1.55; }
  .rules b { color: var(--gold); }
  .rules img { width: 18px; height: 18px; vertical-align: -4px; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
</style>
</head>
<body>
<div id="app">
  <h1>🎰 슬롯 체험</h1>
  <div class="sub">지금 방식과 새 방식을 번갈아 돌려 보세요</div>
  <div class="modes"><button data-m="old">지금 방식</button><button data-m="new" class="on">새 방식 (①②③)</button></div>
  <div id="stage">
    <div id="dim"></div>
    <div id="counter"><b>0</b><small></small></div>
    <div id="reels"></div>
    <div id="line"></div>
  </div>
  <div class="ctrl"><button id="spin">돌리기</button><button id="auto" class="ghost">자동 OFF</button></div>
  <div id="stats"></div>
  <div class="rules" id="rules"></div>
</div>
<div id="flash"></div>
<script src="js/sound.js"></script>
<script src="js/idle.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), wait = ms => new Promise(r => setTimeout(r, ms)), rnd = Math.random;
  const S = window.Sound || { play() {}, unlock() {} };
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const IMG = { pick: 'assets/items/pick2.png', gem: 'assets/blocks/diamond.png', chest: 'assets/chests/c5.png', tnt: 'assets/items/tnt.png',
    gold: 'assets/syms/gold.webp', rainbow: 'assets/syms/rainbow.webp', wrench: 'assets/syms/wrench.webp', coin: 'assets/ui/coin.png',
    glass: 'assets/syms/glass.webp', egg: 'assets/syms/egg.webp', mimic: 'assets/syms/mimic.webp' };
  const img = k => `<img src="${IMG[k]}" alt="">`;
  let mode = 'new', busy = false, auto = false;
  const stat = { n: 0, best: 0, lines: 0, jack: 0, sum: 0 };

  // ---------------- 새 방식 ----------------
  //  ① 왼쪽부터 이어진 같은 그림만 '줄' (🌈은 아무 그림) + 3칸(황금은 2칸) 이어지면 남은 칸이 천천히 (긴장)
  //  ② 기본 피해(칩) × 배율이 왼쪽부터 쌓이며 숫자가 불어남. 별일 없으면 짧게
  //  ③ 심볼 7개, 역할 하나씩
  const NS = {
    pick: { w: 20, chip: 10, name: '곡괭이', role: '피해 +10' },
    gem: { w: 14, chip: 30, name: '보석', role: '피해 +30' },
    gold: { w: 14, chip: 15, name: '황금', role: '피해 +15 · 줄이 되면 잭팟' },
    chest: { w: 9, chip: 0, mult: 2, name: '상자', role: '배율 ×2' },
    tnt: { w: 10, chip: 0, name: 'TNT', role: '오른쪽 칸 효과 2배' },
    rainbow: { w: 5, chip: 10, name: '무지개', role: '아무 그림으로 쳐 줌 (줄 잇기)' },
    wrench: { w: 9, chip: 5, name: '렌치', role: '피해 +5 · 곡괭이 수리' },
  };
  const LINE = { 3: 3, 4: 6, 5: 15 }, JACK = { 3: 10, 4: 30, 5: 100 };
  const pickW = () => { const ks = Object.keys(NS); let t = ks.reduce((a, k) => a + NS[k].w, 0), x = rnd() * t; for (const k of ks) { x -= NS[k].w; if (x < 0) return k; } return 'pick'; };
  function lineOf(sy) {
    let base = sy.find(s => s !== 'rainbow') || 'gold', n = 0;
    for (const s of sy) { if (s === base || s === 'rainbow') n++; else break; }
    return { base, n };
  }

  // ---------------- 지금 방식 (실제 게임 엔진 그대로) ----------------
  const I = window.Idle;
  const ost = I ? Object.assign(I.newState(), { best: 30, allBest: 30, floor: 30 }) : null;
  if (ost) Object.assign(ost.lv, { atk: 10, gem: 8, chest: 6, cells: 2 });

  function buildReels(n) {
    $('#reels').innerHTML = Array.from({ length: n }, () => `<div class="reel">${img('pick')}</div>`).join('');
  }
  function setCounter(v, sub, cls) {
    const c = $('#counter'); c.querySelector('b').textContent = typeof v === 'number' ? fmt(v) : v;
    c.querySelector('small').textContent = sub || ''; c.className = cls || '';
    c.querySelector('b').animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' });
  }
  function flash(color, a = .5, ms = 300) { const f = $('#flash'); f.style.background = color; f.animate([{ opacity: a }, { opacity: 0 }], { duration: ms }); }
  function shake(amp, ms = 300) { const k = []; for (let i = 0; i < 7; i++) { const d = amp * (1 - i / 7); k.push({ transform: `translate(${(rnd() - .5) * 2 * d}px,${(rnd() - .5) * 2 * d}px)` }); } k.push({ transform: 'none' }); $('#stage').animate(k, { duration: ms }); }
  // 칸에서 카운터로 날아가는 숫자
  function fly(fromEl, text, cls) {
    const app = $('#app').getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = $('#counter b').getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'fly ' + (cls || ''); d.textContent = text;
    d.style.left = (a.left + a.width / 2 - app.left - 14) + 'px'; d.style.top = (a.top - app.top) + 'px'; $('#app').appendChild(d);
    const dx = b.left + b.width / 2 - a.left - a.width / 2, dy = b.top - a.top + 10;
    d.animate([{ transform: 'translate(0,0) scale(1.4)', opacity: 1 }, { transform: `translate(${dx * .3}px,-20px) scale(1.2)`, opacity: 1, offset: .3 }, { transform: `translate(${dx}px,${dy}px) scale(.7)`, opacity: .2 }], { duration: 380, easing: 'ease-in' });
    setTimeout(() => d.remove(), 380);
  }
  function tag(el, text, cls) { const t = document.createElement('span'); t.className = 'tag ' + (cls || ''); t.textContent = text; el.appendChild(t); t.animate([{ transform: 'translate(-50%,8px) scale(.5)', opacity: 0 }, { transform: 'translate(-50%,0) scale(1.15)', opacity: 1 }], { duration: 180, fill: 'none' }); }

  // 릴 돌리기: 왼쪽부터 멈춤. (새 방식) 앞 칸들이 이어지면 남은 칸이 천천히 + 화면 어둡게
  async function spinReels(sy, keys, tension) {
    const els = [...document.querySelectorAll('.reel')];
    els.forEach(e => { e.className = 'reel spin'; e.querySelectorAll('.tag').forEach(t => t.remove()); });
    let stopped = 0, t0 = performance.now(), stopAt = els.map((_, i) => 380 + i * 170);
    let tense = false;
    while (stopped < els.length) {
      const now = performance.now() - t0;
      for (let i = stopped; i < els.length; i++) els[i].innerHTML = img(keys[Math.floor(rnd() * keys.length)]);
      if (now >= stopAt[stopped]) {
        const i = stopped, e = els[i];
        e.className = 'reel'; e.innerHTML = img(sy[i]);
        e.animate([{ transform: 'translateY(-10px)' }, { transform: 'translateY(3px)' }, { transform: 'none' }], { duration: 160 });
        S.play('stop'); stopped++;
        // 긴장: 지금까지 이어진 줄이 2칸 이상이면, 남은 칸을 천천히
        if (tension && stopped >= 2 && stopped < els.length) {
          const L = lineOf(sy.slice(0, stopped));
          if (L.n === stopped && (stopped >= 3 || L.base === 'gold')) {   // 3칸 연결, 또는 황금 2칸 연결일 때만 (자주 나오면 무뎌짐)
            if (!tense) { tense = true; $('#stage').classList.add('tense'); }
            const slowBy = L.base === 'gold' ? 900 : 650;
            for (let j = stopped; j < els.length; j++) { stopAt[j] = Math.max(stopAt[j], now + slowBy * (j - stopped + 1)); els[j].classList.add('slow'); }
            S.play('drumroll');
          } else if (tense) { tense = false; $('#stage').classList.remove('tense'); els.forEach(x => x.classList.remove('slow')); }
        }
      }
      await wait(tense ? 70 : 45);
    }
    $('#stage').classList.remove('tense');
    els.forEach(x => x.classList.remove('slow'));
    return els;
  }

  async function spinNew() {
    const sy = Array.from({ length: 5 }, pickW);
    setCounter('…', '', ''); $('#line').textContent = ''; $('#line').className = '';
    const els = await spinReels(sy, Object.keys(NS), true);
    const L = lineOf(sy), jack = L.n >= 3 && L.base === 'gold';
    // 계산: 왼쪽부터 칩을 더하고, 배율을 곱함. 💣는 오른쪽 칸 효과 2배
    let chips = 0, mult = 1, boost = 1;
    const steps = [];
    sy.forEach((s, i) => {
      const N = NS[s], k = boost; boost = 1;
      if (s === 'tnt') { boost = 2; steps.push({ i, kind: 'tnt' }); return; }
      if (N.chip) { chips += N.chip * k; steps.push({ i, kind: 'chip', v: N.chip * k, k }); }
      if (N.mult) { const m = 1 + (N.mult - 1) * k; mult *= m; steps.push({ i, kind: 'mult', v: m }); }
    });
    const lx = L.n >= 3 ? (jack ? JACK[L.n] : LINE[L.n]) : 1;
    const total = chips * mult * lx;
    const special = L.n >= 3 || mult > 1;
    if (!special) {
      // 별일 없으면 짧게: 결과 숫자만
      setCounter(total, '');
    } else {
      let shown = 0, m = 1;
      setCounter(0, '');
      for (const st of steps) {
        const e = els[st.i];
        e.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18) translateY(-6px)' }, { transform: 'scale(1)' }], { duration: 200 });
        if (st.kind === 'tnt') { tag(e, '💥 옆 ×2', 'mult'); S.play('boom'); shake(4, 200); await wait(220); continue; }
        if (st.kind === 'chip') { fly(e, '+' + st.v); tag(e, '+' + st.v); await wait(200); shown += st.v; setCounter(shown * m, `피해 ${fmt(shown)}${m > 1 ? ' × ' + m : ''}`); S.play('tick'); await wait(110); }
        else { fly(e, '×' + st.v, 'mult'); tag(e, '×' + st.v, 'mult'); await wait(200); m *= st.v; setCounter(shown * m, `피해 ${fmt(shown)} × ${m}`, 'big'); S.play('gem'); flash('#ff5a3a', .2, 200); await wait(180); }
      }
      if (L.n >= 3) {
        await wait(150);
        els.slice(0, L.n).forEach((e, i) => { e.classList.add('line'); if (jack) e.classList.add('gold'); e.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 260, delay: i * 70 }); });
        $('#line').textContent = jack ? `⭐ ${L.n}개 연결! JACKPOT ×${lx}` : `${NS[L.base].name} ${L.n}개 연결! ×${lx}`;
        $('#line').className = jack ? 'gold' : '';
        S.play(jack ? 'chestBig' : 'big');
        await wait(420);
        // 숫자가 촤르륵 불어남
        const from = shown * m, steps2 = 14;
        for (let k = 1; k <= steps2; k++) { setCounter(from + (total - from) * (k / steps2) ** 2, `피해 ${fmt(shown)} × ${m} × ${lx}`, jack ? 'huge' : 'big'); await wait(40); }
        flash(jack ? '#ffd34a' : '#7ff7ff', jack ? .8 : .4, 400); shake(jack ? 14 : 7, 400);
        if (jack) S.play('fanfare');
      }
    }
    return { total, line: L.n >= 3, jack };
  }

  async function spinOld() {
    const sy = I.roll(ost, rnd), r = I.evalSpin(ost, sy, rnd);
    setCounter('…', ''); $('#line').textContent = '';
    const els = await spinReels(sy, I.unlocked(ost), false);
    // 지금 게임처럼: 결과 숫자 + 계산식 한 줄
    const parts = [`${+r.hits.toFixed(2)}타`, `공격력 ${fmt(r.atk)}`];
    if (r.combo > 1) parts.push(`${r.jackpot ? '잭팟' : '콤보'} ×${r.combo}`);
    if (r.chests) parts.push(`상자 ×${+r.chestMult.toFixed(2)}`);
    if (r.mimics) parts.push(r.mimicOk ? `미믹 ×${fmt(r.mimicMult)}` : '미믹 꽝');
    setCounter(r.dmg, parts.join(' × '), r.combo > 1 ? 'big' : '');
    if (r.comboSym) els.forEach((e, i) => { if (r.res[i] === r.comboSym) e.classList.add('line'); });
    if (r.jackpot) { $('#line').textContent = 'JACKPOT!'; $('#line').className = 'gold'; S.play('chestBig'); flash('#ffd34a', .7); shake(12); }
    else if (r.combo > 1) { $('#line').textContent = `${r.comboN}콤보!`; S.play('big'); }
    return { total: r.dmg, line: r.combo > 1, jack: r.jackpot };
  }

  async function spin() {
    if (busy) return; busy = true; $('#spin').disabled = true; S.unlock && S.unlock();
    const r = await (mode === 'new' ? spinNew() : spinOld());
    stat.n++; stat.sum += r.total; stat.best = Math.max(stat.best, r.total); if (r.line) stat.lines++; if (r.jack) stat.jack++;
    $('#stats').textContent = `${mode === 'new' ? '새 방식' : '지금 방식'} · ${stat.n}번 · 줄/콤보 ${stat.lines}번 · 잭팟 ${stat.jack}번 · 최고 ${fmt(stat.best)}`;
    busy = false; $('#spin').disabled = false;
  }
  function setMode(m) {
    mode = m; Object.assign(stat, { n: 0, best: 0, lines: 0, jack: 0, sum: 0 }); $('#stats').textContent = '';
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    buildReels(5); setCounter(0, ''); $('#line').textContent = '';
    $('#rules').innerHTML = m === 'new'
      ? `<b>새 방식 규칙</b><br>① <b>왼쪽부터 같은 그림이 이어지면</b> 줄 (3개 ×3 · 4개 ×6 · 5개 ×15, 🌈는 아무 그림)<br>&nbsp;&nbsp;&nbsp;⭐ 황금 줄은 <b>잭팟</b> (×10 · ×30 · ×100)<br>② 왼쪽부터 칸이 터지며 <b>피해 × 배율</b>이 쌓여요 (별일 없으면 짧게)<br>③ 심볼 7개: ${Object.keys(NS).map(k => `${img(k)} ${NS[k].role}`).join(' · ')}`
      : `<b>지금 방식</b> (실제 게임 엔진 그대로, 중반 상태)<br>심볼 11종이 칸마다 따로 나오고, 같은 그림이 <b>어디에든</b> 3개 이상이면 콤보. TNT는 양옆 2배, 무지개 변신, 미믹 70/30, 황금 3개 잭팟.`;
  }
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { if (!busy) setMode(b.dataset.m); });
  $('#spin').onclick = spin;
  $('#auto').onclick = () => { auto = !auto; $('#auto').textContent = auto ? '자동 ON' : '자동 OFF'; $('#auto').classList.toggle('on', auto); };
  (async function loop() { for (;;) { await wait(700); if (auto && !busy) await spin(); } })();
  document.addEventListener('pointerdown', () => S.unlock && S.unlock(), { once: true });
  setMode('new');
})();
</script>
</body>
</html>
