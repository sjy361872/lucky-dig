<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>곡괭이 장인 (체험판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120e14; --panel:rgba(28,20,24,.92); --line:#5a4134; --text:#fbefe2; --dim:#c4ab98; --gold:#ffd54a; --fire:#ff8a3c; --cry:#5fe0ff; --red:#ff5a5f; --green:#5be37d;
    --g0:#c8c8c8; --g1:#4aa3ff; --g2:#ffb020; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #app { position:relative; max-width:480px; height:100%; margin:0 auto; overflow:hidden; }
  #game { position:absolute; inset:0; }
  #game canvas { display:block; margin:0 auto; touch-action:none; }
  #ui { position:absolute; inset:0; pointer-events:none; }
  .panel { position:absolute; left:12px; right:12px; pointer-events:auto; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 6px 30px rgba(0,0,0,.5); }
  .top { top:12px; } .bot { bottom:calc(12px + env(safe-area-inset-bottom)); } .mid { top:50%; transform:translateY(-50%); }
  .hide { display:none !important; }
  h2 { margin:0 0 6px; font:normal 24px "Black Han Sans",sans-serif; color:var(--gold); }
  .sub { margin:0 0 10px; color:var(--dim); font-size:13px; line-height:1.45; }
  .big { font-family:"Black Han Sans",sans-serif; font-weight:normal; }
  button { font-family:inherit; }
  .btn { width:100%; padding:13px; border-radius:12px; border:0; background:linear-gradient(#ffb44a,#e2762a); color:#2a1200; font-size:17px; font-weight:800; }
  .btn:disabled { background:#4a3a33; color:#8d7a6e; }
  .btn.alt { background:#3a2c27; color:var(--text); border:2px solid var(--line); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  /* 재료 */
  .slots { display:flex; gap:10px; justify-content:center; margin:6px 0 12px; }
  .slot { width:72px; height:72px; border-radius:14px; border:2px dashed #7a5a48; display:flex; align-items:center; justify-content:center; font-size:34px; background:rgba(0,0,0,.25); }
  .slot.f { border-style:solid; }
  .mats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .mat { padding:10px 6px; border-radius:12px; border:2px solid var(--line); background:#2c201c; color:var(--text); text-align:center; }
  .mat b { display:block; font-size:26px; line-height:1.1; }
  .mat span { font-size:13px; font-weight:700; } .mat small { display:block; font-size:11px; color:var(--dim); margin-top:2px; }
  .preview { font-size:13px; color:var(--dim); margin:0 0 10px; min-height:18px; text-align:left; line-height:1.55; }
  .preview b { color:var(--text); }
  .preview .mini { margin-top:6px; text-align:center; color:var(--text); }
  .note { font-size:11px; color:var(--dim); }
  .shape small b { display:inline; font-size:inherit; margin:0; color:var(--text); }
  .shape.sel { border-color:var(--gold); background:#43301f; box-shadow:0 0 0 2px rgba(255,213,74,.35) inset; }
  /* 모양 */
  .shapes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .shape { padding:12px 8px; border-radius:14px; border:2px solid var(--line); background:#2c201c; color:var(--text); text-align:center; }
  .shape img { height:70px; } .shape .two img { height:56px; margin:0 -8px; }
  .shape b { display:block; font-size:16px; margin-top:4px; } .shape small { display:block; color:var(--dim); font-size:12px; margin-top:2px; line-height:1.35; }
  /* 결과 카드 */
  .card { text-align:center; }
  .card .gname { font:normal 30px "Black Han Sans",sans-serif; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0; }
  .stats div { background:rgba(0,0,0,.3); border-radius:10px; padding:6px; font-size:12px; color:var(--dim); }
  .stats b { display:block; font:normal 20px "Black Han Sans",sans-serif; color:var(--text); }
  .odds { display:flex; gap:6px; justify-content:center; margin:8px 0 2px; }
  .odds span { padding:4px 10px; border-radius:20px; font-weight:800; font-size:14px; background:rgba(0,0,0,.35); }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:700; margin:0 2px; }
  .t-iron { background:#5b5f66; } .t-crystal { background:#1f6f88; } .t-fire { background:#9a3d14; }
  /* 단계 */
  .stage-ico { font-size:40px; }
  .warn { color:var(--fire); font-weight:700; }
  .hint { position:absolute; left:0; right:0; text-align:center; pointer-events:none; font-weight:800; font-size:17px; color:#fff; text-shadow:0 2px 6px #000, 0 0 2px #000; }
  #modeTag { position:absolute; top:6px; right:10px; font-size:10px; color:var(--dim); opacity:.6; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div id="ui">
    <div id="modeTag"></div>

    <!-- 시작 -->
    <div id="pStart" class="panel mid card">
      <h2 style="font-size:36px">곡괭이 장인</h2>
      <p class="sub">광석을 넣고, 손으로 곡괭이를 빚어<br>그 곡괭이로 광산 3곳을 뚫어 보세요.<br><b id="startMode"></b></p>
      <button class="btn" id="bStart">대장간으로</button>
    </div>

    <!-- 1. 재료 -->
    <div id="pMat" class="panel bot hide">
      <h2>① 재료 넣기</h2>
      <p class="sub">화로에 광석 3개를 넣어요. 같은 걸 여러 개 넣으면 그 성질이 강해져요. (칸을 누르면 빼기) · 위 <b>시험대</b>에서 바로 쳐 봐요</p>
      <div class="slots" id="slots"></div>
      <div class="mats" id="mats"></div>
      <div class="preview" id="matPrev"></div>
      <button class="btn" id="bMatNext" disabled>다음: 모양 고르기</button>
    </div>

    <!-- 2. 모양 -->
    <div id="pShape" class="panel bot hide">
      <h2>② 모양 고르기</h2>
      <p class="sub" id="shapeNext"></p>
      <div class="shapes" id="shapes"></div>
      <button class="btn" id="bShapeGo" disabled>모양을 골라 주세요</button>
    </div>

    <!-- 3. 액션 안내 -->
    <div id="pAct" class="panel top hide"><h2 id="actTitle">③</h2><p class="sub" id="actTxt" style="margin:0"></p></div>

    <!-- 4. 판정 -->
    <div id="pOdds" class="panel top hide card">
      <h2 id="accTxt">정확도</h2>
      <div class="odds" id="odds"></div>
    </div>

    <!-- 5. 완성 -->
    <div id="pPick" class="panel bot hide card">
      <div class="gname" id="pkName"></div>
      <div id="pkTags"></div>
      <div class="stats" id="pkStats"></div>
      <div id="pkBtns"></div>
    </div>

    <!-- 스테이지 소개 -->
    <div id="pStage" class="panel mid hide card">
      <div class="stage-ico" id="stIco"></div>
      <h2 id="stName"></h2>
      <p class="sub" id="stTxt"></p>
      <button class="btn" id="bGo">출발!</button>
    </div>

    <!-- 작업 선택 -->
    <div id="pWork" class="panel bot hide">
      <h2 id="wkTitle"></h2>
      <p class="sub" id="wkTxt"></p>
      <div class="row" style="margin-bottom:8px">
        <button class="btn alt" id="bUp"></button>
        <button class="btn alt" id="bRe"></button>
      </div>
      <p class="sub" id="wkNext" style="margin:6px 0 0"></p>
    </div>

    <!-- 끝 -->
    <div id="pEnd" class="panel mid hide card">
      <h2 style="font-size:34px">광산 정복!</h2>
      <div id="endTxt" class="sub" style="text-align:left"></div>
      <button class="btn" id="bAgain">처음부터 다시</button>
      <p style="margin:12px 0 0"><a id="bOther" href="#" style="color:var(--dim)"></a></p>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="game.js?v=2"></script>
</body>
</html>
