<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261114221459">
<meta name="app-note" content="럭키 디그 v1 종료 - 새로운 기능으로 찾아뵙겠습니다">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>럭키 디그 - COMING SOON</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:hidden}
  body{
    background:#141623;color:#f3ead8;
    font-family:'Galmuri11',sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;padding:24px 16px;text-align:center;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%;max-width:360px;background:#1f2235;
    border:2px solid #2e3250;border-radius:14px;padding:32px 20px 28px;
    box-shadow:0 0 0 4px #141623,0 0 0 6px #2e3250;
  }
  .emblem{width:72px;height:72px;image-rendering:pixelated;margin:0 auto 16px;display:block;animation:bob 2.4s ease-in-out infinite}
  .name{font-size:30px;color:#ffad3b;letter-spacing:2px;text-shadow:3px 3px 0 #000}
  .msg{margin-top:22px;font-size:16px;line-height:1.6;word-break:keep-all}
  .soon{margin-top:22px;font-size:20px;color:#ffad3b;letter-spacing:3px}
  .soon i{font-style:normal;animation:blink 1.2s steps(1) infinite}
  .soon i:nth-child(2){animation-delay:.2s}
  .soon i:nth-child(3){animation-delay:.4s}
  .note{margin-top:24px;font-size:12px;line-height:1.6;color:#a9a3bf;word-break:keep-all}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>
  <main class="card">
    <img class="emblem" src="assets/v2/emblems/S.webp" alt="">
    <h1 class="name">럭키 디그</h1>
    <p class="msg">새로운 기능으로<br>찾아뵙겠습니다</p>
    <p class="soon">COMING SOON<i>.</i><i>.</i><i>.</i></p>
    <p class="note">지금까지 모은 포인트와 카드는<br>그대로 남아 있어요</p>
  </main>
</body>
</html>
