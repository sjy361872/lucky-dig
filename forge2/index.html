<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>곡괭이 장인 (체험판 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120e14; --panel:rgba(28,20,24,.94); --line:#5a4134; --text:#fbefe2; --dim:#c4ab98; --gold:#ffd54a; --fire:#ff8a3c; --cry:#7fe8ff; --red:#ff5a5f; --green:#5be37d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #app { position:relative; max-width:480px; height:100%; margin:0 auto; overflow:hidden; }
  #game { position:absolute; inset:0; }
  #game canvas { display:block; margin:0 auto; touch-action:none; }
  #ui { position:absolute; inset:0; pointer-events:none; }
  .panel { position:absolute; left:10px; right:10px; pointer-events:auto; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 6px 30px rgba(0,0,0,.5); max-height:calc(100% - 20px); overflow-y:auto; }
  .top { top:10px; } .bot { bottom:calc(10px + env(safe-area-inset-bottom)); } .mid { top:50%; transform:translateY(-50%); }
  .hide { display:none !important; }
  h2 { margin:0 0 6px; font:normal 23px "Black Han Sans",sans-serif; color:var(--gold); }
  h3 { margin:8px 0 4px; font-size:13px; color:var(--dim); font-weight:700; }
  .sub { margin:0 0 8px; color:var(--dim); font-size:13px; line-height:1.45; }
  .sub b { color:var(--text); }
  .warn { color:var(--fire); font-weight:700; }
  .big { font-family:"Black Han Sans",sans-serif; font-weight:normal; }
  button { font-family:inherit; }
  .btn { width:100%; padding:12px; border-radius:12px; border:0; background:linear-gradient(#ffb44a,#e2762a); color:#2a1200; font-size:16px; font-weight:800; }
  .btn:disabled { background:#4a3a33; color:#8d7a6e; }
  .btn.alt { background:#3a2c27; color:var(--text); border:2px solid var(--line); }
  .btn.pink { background:linear-gradient(#ff8fb0,#e04a7a); color:#2a0010; }
  .btn small { display:block; font-weight:500; font-size:11px; opacity:.85; margin-top:2px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .res { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; margin:0 0 8px; padding:6px 8px; background:rgba(0,0,0,.3); border-radius:10px; }
  .res span { white-space:nowrap; } .res .g { color:var(--gold); font-weight:800; }
  /* 부위 고르기 */
  .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .opt { position:relative; padding:6px 4px 6px; border-radius:12px; border:2px solid var(--line); background:#2c201c; color:var(--text); text-align:center; min-height:84px; }
  .opt.sel { border-color:var(--gold); background:#43301f; box-shadow:0 0 0 2px rgba(255,213,74,.35) inset; }
  .opt:disabled { opacity:.4; }
  .opt .pic { height:34px; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .opt .pic img { max-height:34px; max-width:88%; }
  .opt .pic img.rot { transform:rotate(90deg); max-height:none; height:84px; width:auto; margin:-25px 0; }
  .opt b { display:block; font-size:13px; margin-top:2px; }
  .opt small { display:block; font-size:10.5px; color:var(--dim); line-height:1.3; margin-top:2px; }
  .opt.slot { min-height:74px; } .opt.slot .lab { display:block; font-size:10.5px; color:var(--dim); }
  .opt.slot.open { border-color:var(--gold); }
  #oMore { margin-top:8px; padding:6px; border-radius:12px; background:rgba(0,0,0,.25); } #oMore h3 { margin:0 0 6px; }
  .opt .cnt { position:absolute; top:3px; right:6px; font-size:11px; color:var(--dim); font-weight:700; }
  .pname { text-align:center; font:normal 20px "Black Han Sans",sans-serif; margin:10px 0 2px; }
  .cost { text-align:center; font-size:12px; color:var(--dim); margin-bottom:8px; }
  /* 곡괭이 카드 */
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .pcard { border:2px solid var(--line); border-radius:14px; padding:8px; background:#2c201c; text-align:center; position:relative; color:var(--text); }
  .pcard.eq { border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,213,74,.3) inset; }
  .pcard.empty { color:var(--dim); font-size:13px; display:flex; align-items:center; justify-content:center; min-height:120px; border-style:dashed; }
  .pcard .tagEq { position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:var(--gold); color:#2a1200; font-size:11px; font-weight:800; padding:1px 8px; border-radius:8px; white-space:nowrap; }
  .pcard .nm { font-size:12.5px; font-weight:800; line-height:1.3; margin-top:4px; }
  .pcard .st { font-size:11px; color:var(--dim); margin-top:3px; line-height:1.4; }
  .durbar { height:8px; background:rgba(0,0,0,.5); border-radius:5px; overflow:hidden; margin-top:4px; }
  .durbar i { display:block; height:100%; background:var(--green); }
  .pk { position:relative; width:64px; height:72px; margin:0 auto; }
  .pk img { position:absolute; left:50%; transform:translateX(-50%); }
  .pk .hd { top:2px; width:62px; } .pk .gr { top:6px; height:66px; }
  .tint-crystal { filter:sepia(1) saturate(3.5) hue-rotate(150deg) brightness(1.15); }
  .tint-fire { filter:sepia(1) saturate(4.5) hue-rotate(-25deg) brightness(1.05); }
  .acts { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:8px; }
  .acts .btn { font-size:13px; padding:9px 4px; }
  .result { font-size:14px; margin:0 0 8px; line-height:1.5; }
  /* 현장 소개 */
  .lineup { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:6px 0; }
  .lineup div { width:44px; text-align:center; font-size:10px; color:var(--dim); }
  .lineup img { width:40px; height:40px; object-fit:contain; display:block; margin:0 auto; }
  .lineup .boss img { width:56px; height:56px; } .lineup .boss { width:62px; color:var(--red); font-weight:800; }
  /* 전투 HUD · 로그 */
  #hud { position:absolute; top:8px; left:10px; right:10px; pointer-events:auto; }
  #hud .bar1 { display:flex; align-items:center; gap:8px; }
  #hud .ttl { flex:1; font:normal 19px "Black Han Sans",sans-serif; text-shadow:0 2px 4px #000; }
  #hud .ttl small { font:700 13px sans-serif; color:var(--dim); margin-left:4px; }
  #spd { pointer-events:auto; padding:6px 12px; border-radius:10px; border:2px solid var(--line); background:#3a2c27; color:var(--text); font-weight:800; font-size:15px; }
  #spd.on { background:var(--gold); color:#2a1200; }
  #hud .dur { margin-top:6px; display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; text-shadow:0 1px 3px #000; }
  #hud .dur .durbar { flex:1; height:14px; margin:0; border:2px solid #000; }
  #hud .prog { margin-top:5px; font-size:12px; color:var(--dim); text-shadow:0 1px 3px #000; }
  #log { position:absolute; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); background:rgba(12,8,10,.86); border:2px solid var(--line); border-radius:12px; padding:7px 10px; font-size:13.5px; line-height:1.5; min-height:72px; pointer-events:none; }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; animation:none; }
  #log div:last-child { color:#fff; }
  #log div:not(:last-child) { opacity:.6; }
  .c-hit { color:#fff2d8; } .c-story { color:#9fd8ff; } .c-find { color:#ffd54a; } .c-hurt { color:#ff9a8a; } .c-warn { color:#ff5a5f; font-weight:800; } .c-fx { color:#c9b6ff; } .c-good { color:#5be37d; font-weight:800; }
  .hint { position:absolute; left:0; right:0; text-align:center; pointer-events:none; font-weight:800; font-size:17px; color:#fff; text-shadow:0 2px 6px #000, 0 0 2px #000; }
  .odds { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .odds span { padding:3px 8px; border-radius:20px; font-weight:800; font-size:13px; background:rgba(0,0,0,.4); }
  .score { display:flex; gap:8px; justify-content:center; margin-top:6px; }
  .score span { min-width:84px; padding:4px 8px; white-space:nowrap; border-radius:10px; background:rgba(0,0,0,.4); text-align:center; font-weight:800; font-size:14px; }
</style>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div id="ui">
    <!-- 시작 -->
    <div id="pStart" class="panel mid" style="text-align:center">
      <h2 style="font-size:36px">곡괭이 장인</h2>
      <p class="sub">부위를 골라 망치로 곡괭이를 만들고<br>의뢰 현장 3곳을 뚫어 보세요.<br>전투는 자동이에요. 곡괭이가 부서지지 않게!</p>
      <button class="btn" id="bStart">대장간으로</button>
    </div>

    <!-- 부위 고르기 -->
    <div id="pParts" class="panel bot hide">
      <h2>곡괭이 만들기</h2>
      <div class="res" id="partsRes"></div>
      <div class="opts" id="oSlots"></div>
      <div id="oMore" class="hide"><h3 id="oMoreT"></h3><div class="opts" id="oPick"></div></div>
      <div class="pname" id="pName"></div>
      <div class="cost" id="pCost"></div>
      <div class="row"><button class="btn alt hide" id="bPartsBack" style="flex:.45">취소</button><button class="btn" id="bForge" disabled>망치질 시작</button></div>
    </div>

    <!-- 약점 3타 -->
    <div id="pTap" class="panel top hide" style="text-align:center">
      <h2 id="tapTitle">세 번 내려치기</h2>
      <p class="sub" id="tapSub" style="margin:0">흰 빛줄이 <b style="color:var(--gold)">금색 선</b>에 겹칠 때 화면을 <b>아래로 쓸어</b> 내려쳐요</p>
      <div class="score" id="tapScore"></div>
      <div class="odds" id="tapOdds" style="margin-top:6px"></div>
    </div>

    <!-- 룰렛 -->
    <div id="pRoul" class="panel top hide" style="text-align:center">
      <h2 id="roulTitle">등급 룰렛</h2>
      <p class="sub" style="margin:0">점수가 높을수록 좋은 등급 칸이 넓어져요</p>
      <div class="odds" id="roulOdds"></div>
    </div>

    <!-- 새 곡괭이 -->
    <div id="pNew" class="panel bot hide" style="text-align:center">
      <div id="newCard"></div>
      <div id="newBtns" style="margin-top:10px"></div>
    </div>

    <!-- 현장 소개 -->
    <div id="pIntro" class="panel bot hide">
      <h2 id="inTitle"></h2>
      <p class="sub" id="inInfo"></p>
      <div class="lineup" id="inLine"></div>
      <div id="inPick" style="margin:8px 0"></div>
      <div class="row"><button class="btn alt" id="bInFix" style="flex:.5">정비</button><button class="btn" id="bGo">출발!</button></div>
    </div>

    <!-- 정비 -->
    <div id="pFix" class="panel bot hide">
      <h2 id="fxTitle">정비</h2>
      <div class="result" id="fxResult"></div>
      <button class="btn pink hide" id="bRevive" style="margin-bottom:8px"></button>
      <div class="res" id="fxRes"></div>
      <div class="cards" id="fxCards"></div>
      <div class="acts" id="fxActs"></div>
      <button class="btn alt" id="bCraft" style="margin-bottom:8px"></button>
      <button class="btn" id="bNext"></button>
    </div>

    <!-- 전투 HUD · 로그 -->
    <div id="hud" class="hide">
      <div class="bar1"><div class="ttl" id="hTtl"></div><button id="spd">×1</button></div>
      <div class="dur"><span>⛏</span><div class="durbar"><i id="hDurBar"></i></div><span id="hDur"></span></div>
      <div class="prog" id="hProg"></div>
    </div>
    <div id="log" class="hide"></div>

    <!-- 끝 -->
    <div id="pEnd" class="panel mid hide">
      <h2 style="font-size:32px;text-align:center">의뢰 3곳 완료!</h2>
      <div id="endTxt" class="sub"></div>
      <button class="btn" id="bAgain">처음부터 다시</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="rules.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
