<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>엔진 검증</title>
<style>body{font-family:sans-serif;padding:20px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 10px}</style></head>
<body><h2>엔진 검증</h2><p>판 수 <input id="n" value="20000"> 소비 포인트 <input id="bet" value="10000"> <button id="run">실행</button></p><div id="out"></div>
<script src="js/config.js"></script><script src="js/engine.js"></script><script src="js/selftest.js"></script>
<script>
document.getElementById('run').onclick = () => {
  const r = runSelfTest(+n.value, +bet.value);
  out.innerHTML = `<table><tr><th>등급</th><th>설정 출현율</th><th>실제</th><th>평균 재생성 횟수</th></tr>${r.rows.map(x => `<tr><td>${x.grade}</td><td>${x.expected}</td><td>${x.actual}</td><td>${x.avgTries}</td></tr>`).join('')}</table>
  <p>환원율 <b>${r.returnRate}</b> · 스코어 범위 오류 <b>${r.bad.length}</b>건 · ${r.ms}ms</p>`;
};
</script></body></html>
