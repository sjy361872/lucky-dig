<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광맥 깨기 체험 (프로토타입)</title>
<style>
  :root { --gold: #ffd34a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { margin: 0; min-height: 100vh; background: #120a03 url(assets/ui/bg.jpg) center/cover; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #fff; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 440px; padding: 12px 16px 30px; position: relative; overflow: hidden; }
  h1 { font-size: 18px; text-align: center; margin: 2px 0 8px; text-shadow: 0 2px 0 #000; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button, .opts button { flex: 1; padding: 10px 4px; border-radius: 12px; border: 2px solid #000; font-weight: 900; font-size: 14px; background: #4a2c0e; color: #ffe9b0; }
  .tabs button.on, .opts button.on { background: linear-gradient(#ffd34a, #e08a00); color: #3a1a00; }
  .opts { display: flex; gap: 6px; margin-top: 10px; align-items: center; font-size: 12px; }
  .opts button { padding: 7px 0; font-size: 13px; }
  .opts span { flex: 1.3; text-shadow: 0 1px 0 #000; }

  #field { position: relative; height: 230px; border-radius: 18px; background: radial-gradient(ellipse at 50% 85%, rgba(90,60,30,.85), rgba(25,15,6,.9)); border: 3px solid #1a0f05; overflow: hidden; }
  #field .hp { position: absolute; left: 50px; right: 50px; top: 12px; height: 14px; background: #1a0f05; border: 2px solid #000; border-radius: 7px; overflow: hidden; }
  #field .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff6a5a, #b81d1d); transition: width .25s; }
  #field .hp b { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 10px; text-shadow: 0 1px 0 #000; }
  #mobName { position: absolute; top: 30px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 800; text-shadow: 0 1px 0 #000; }
  #mob { position: absolute; left: 50%; top: 48px; width: 150px; height: 150px; object-fit: contain; transform: translateX(-50%); transition: transform .08s; }
  #mob.hit { transform: translateX(-50%) scale(.92) rotate(-4deg); filter: brightness(2); }
  #mob.die { transition: transform .35s, opacity .35s; transform: translateX(-50%) scale(.3) rotate(40deg); opacity: 0; }
  #pick { position: absolute; right: 26px; bottom: 18px; width: 70px; transform-origin: 80% 80%; transform: rotate(10deg); transition: transform .08s; }
  #pick.swing { transform: rotate(-55deg); }
  #kills { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 8px; }
  #dura { position: absolute; left: 10px; bottom: 10px; width: 150px; height: 16px; background: #1a0f05; border: 2px solid #000; border-radius: 6px; overflow: hidden; display: none; }
  #dura i { display: block; height: 100%; width: 100%; background: linear-gradient(#7fe0ff, #2a8ad0); transition: width .3s; }
  #dura b { position: absolute; left: 0; right: 0; top: 0; font-size: 11px; line-height: 12px; text-align: center; text-shadow: 0 1px 0 #000; }
  .boss #dura { display: block; } .boss #kills { display: none; }
  .boss #mob { width: 175px; height: 175px; top: 40px; }

  #gauge { height: 12px; margin: 8px 4px 0; background: rgba(0,0,0,.6); border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  #gauge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb23a, #ff6a1a); transition: width .2s; }
  .boss #gauge { visibility: hidden; }

  #board { position: relative; margin-top: 8px; min-height: 238px; border-radius: 18px; background: linear-gradient(rgba(59,42,26,.95), rgba(34,22,11,.95)); border: 3px solid #120a04; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #board.tense { box-shadow: 0 0 0 3px #ff5a5a, 0 0 26px #ff5a5a; }
  #total { min-height: 58px; text-align: center; }
  #total b { display: block; font-size: 36px; font-weight: 900; color: var(--gold); -webkit-text-stroke: 1.5px #6b1a00; text-shadow: 0 3px 0 #000; }
  #total small { display: block; font-size: 12.5px; font-weight: 800; color: #ffe9b0; min-height: 16px; text-shadow: 0 1px 0 #000; }
  #total.big b { font-size: 52px; color: #fff3a0; }
  .rows { display: flex; flex-direction: column; gap: 22px; align-items: center; margin-top: 6px; }
  .row { display: flex; gap: 7px; }
  .rock { position: relative; width: 60px; height: 60px; border-radius: 14px; background: rgba(0,0,0,.25); }
  .rock img.r { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
  .rock.drop { animation: drop .32s cubic-bezier(.3,1.6,.6,1) both; }
  @keyframes drop { from { transform: translateY(-70px); opacity: 0; } }
  .rock.shk { animation: shk .09s linear; }
  @keyframes shk { 33% { transform: translate(-3px, 1px); } 66% { transform: translate(3px, -1px); } }
  .rock.slow { animation: tense .25s ease-in-out infinite alternate; }
  @keyframes tense { to { transform: scale(1.1); filter: drop-shadow(0 0 10px #ff5a5a); } }
  .rock.open { background: radial-gradient(circle, rgba(90,60,30,.9), rgba(30,18,8,.9)); box-shadow: inset 0 0 0 2px #6a4a20; }
  .rock.open img.r { width: 76%; height: 76%; margin: 12%; animation: pop .28s cubic-bezier(.3,1.8,.6,1); }
  @keyframes pop { from { transform: scale(.2); } }
  .rock.gold { box-shadow: 0 0 0 3px var(--gold), 0 0 18px var(--gold); background: radial-gradient(circle, #fff3a0, #c27a00); }
  .rock.x2 { box-shadow: 0 0 0 3px #ff7a1a, 0 0 16px #ff7a1a; }
  .rock.miss { opacity: .45; }
  .rock.pickable { cursor: pointer; }
  .rock.picked { box-shadow: 0 0 0 3px #4ad0ff, 0 0 14px #4ad0ff; }
  .rock .tag { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 900; background: #000c; padding: 0 6px; border-radius: 6px; }
  .rock .tag.m { color: #ffb0a0; } .rock .tag.g { color: var(--gold); }
  .rock .hint { position: absolute; top: -9px; right: -7px; font-size: 20px; filter: drop-shadow(0 1px 1px #000); animation: bob 1s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-3px); } }
  .rock .ord { position: absolute; top: -8px; left: -6px; width: 20px; height: 20px; border-radius: 10px; background: #4ad0ff; color: #002; font-size: 12px; font-weight: 900; text-align: center; line-height: 20px; }
  #msg { margin-top: 18px; font-size: 13px; color: #e8c9a0; text-align: center; min-height: 18px; text-shadow: 0 1px 0 #000; }
  .btn { margin-top: 4px; padding: 10px 26px; border: 3px solid #7a4a10; border-radius: 12px; font-size: 16px; font-weight: 900; background: linear-gradient(#ffcf3a, #e0901a); color: #3a2410; }

  .fly { position: absolute; z-index: 5; font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #b81d1d, 0 0 6px #000; pointer-events: none; transition: transform .7s ease-out, opacity .7s; }
  .chip { position: absolute; z-index: 5; width: 6px; height: 6px; background: #8a7a68; border-radius: 1px; pointer-events: none; transition: transform .45s ease-out, opacity .45s; }
  #banner { position: absolute; left: 0; right: 0; top: 70px; z-index: 8; text-align: center; font-size: 40px; font-weight: 900; color: #fff4b0; text-shadow: 0 4px 0 #a05a00, 0 0 20px #ffb300; pointer-events: none; opacity: 0; transform: scale(.5); transition: transform .3s cubic-bezier(.3,1.8,.6,1), opacity .3s; }
  #banner.on { opacity: 1; transform: scale(1); }
  #banner small { display: block; font-size: 15px; color: #fff; text-shadow: 0 2px 0 #000; }
  #ray { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,220,80,.3) 0 8deg, transparent 8deg 20deg); transition: opacity .3s; }
  #ray.on { opacity: 1; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
  #stats { margin-top: 8px; font-size: 12px; text-align: center; opacity: .9; text-shadow: 0 1px 0 #000; }
  .rules { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.6); font-size: 12.5px; line-height: 1.6; }
  .rules b { color: var(--gold); }
  .rules img { width: 18px; height: 18px; vertical-align: -4px; }
</style>
</head>
<body>
<div id="app">
  <h1>⛏ 광맥 깨기 체험</h1>
  <div class="tabs"><button data-m="hunt" class="on">평소 사냥 (자동)</button><button data-m="boss">보스전 (직접 고르기)</button></div>
  <div id="field">
    <div id="ray"></div>
    <div class="hp"><i></i><b></b></div>
    <div id="mobName"></div>
    <img id="mob" alt="">
    <img id="pick" src="assets/picks/pick3.webp" alt="">
    <div id="kills"></div>
    <div id="dura"><i></i><b></b></div>
    <div id="banner"></div>
  </div>
  <div id="gauge"><i></i></div>
  <div id="board"><div id="total"><b>&nbsp;</b><small></small></div><div class="rows" id="rows"></div><div id="msg"></div></div>
  <div class="opts" id="opts"><span>바위 칸 수</span><button data-n="3">3칸</button><button data-n="4">4칸</button><button data-n="5" class="on">5칸</button></div>
  <div id="stats"></div>
  <div class="rules" id="rules"></div>
</div>
<div id="flash"></div>
<script src="js/sound.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), wait = ms => new Promise(r => setTimeout(r, ms)), rnd = Math.random;
  const S = window.Sound || { play() {}, unlock() {} };
  const snd = k => { try { S.play(k); } catch (e) {} };
  const fmt = n => Math.round(n).toLocaleString('ko-KR');

  // ── 바위 속 내용물 ──
  const BASE = 100; // 곡괭이 한 번 공격력
  const K = {
    stone: { img: 'assets/blocks/stone.png',  name: '돌',      hint: '',   v: 1 },
    gem:   { img: 'assets/blocks/diamond.png', name: '보석',    hint: '✨', v: 3 },
    tnt:   { img: 'assets/items/tnt.png',      name: '화약',    hint: '🔥', v: 1 },
    coin:  { img: 'assets/ui/coin.png',        name: '금화',    hint: '🪙', v: 1 },
    gold:  { img: 'assets/syms/gold.webp',     name: '황금',    hint: '💛', v: 1 },
  };
  const GOLD_P = { 3: .40, 4: .30, 5: .25 };          // 칸 수가 달라도 황금 광맥이 비슷하게 자주
  const JACK = { 3: 10, 4: 30, 5: 100 };              // 황금 3·4·5개
  let FORCE = null;
  function rollRock(n) {
    if (FORCE && FORCE.length) return FORCE.shift();
    if (rnd() < GOLD_P[n]) return 'gold';
    const r = rnd() * 100;
    return r < 45 ? 'stone' : r < 70 ? 'gem' : r < 85 ? 'tnt' : 'coin';
  }
  function rollBoss() { const r = rnd() * 100; return r < 30 ? 'stone' : r < 55 ? 'gem' : r < 75 ? 'tnt' : 'gold'; }

  // ── 상태 ──
  let mode = 'hunt', N = 5, busy = false, gauge = 0, kills = 0, mobHp = 0, mobMax = 0, ore = 0, gen = 0;
  const stat = { boards: 0, jack: 0, best: 0, pierce: 0, bossWin: 0, bossLose: 0 };
  const MOBS = ['A0','A1','A2','A3','A4','B0','B1','B2','B3','B4','C0','C1','C2','C3'].map(x => `assets/mobs/1000/${x}.webp`);
  const NAMES = ['풀숲 몬스터', '동굴 몬스터', '바위 몬스터', '이끼 몬스터'];

  function fx(color, a = .5, ms = 250) { const f = $('#flash'); f.style.transition = 'none'; f.style.background = color; f.style.opacity = a; requestAnimationFrame(() => { f.style.transition = `opacity ${ms}ms`; f.style.opacity = 0; }); }
  function shake(px = 6, ms = 250) { const a = $('#app'), t0 = performance.now(); (function f(t) { const k = 1 - (t - t0) / ms; if (k <= 0) { a.style.transform = ''; return; } a.style.transform = `translate(${(rnd() - .5) * px * k}px,${(rnd() - .5) * px * k}px)`; requestAnimationFrame(f); })(t0); }
  function fly(parent, text, x, y, color) {
    const e = document.createElement('div'); e.className = 'fly'; e.textContent = text; e.style.left = x + 'px'; e.style.top = y + 'px'; if (color) e.style.color = color;
    parent.appendChild(e); requestAnimationFrame(() => { e.style.transform = 'translateY(-40px)'; e.style.opacity = 0; }); setTimeout(() => e.remove(), 750);
  }
  function chips(rock) {
    const b = $('#board'), r = rock.getBoundingClientRect(), o = b.getBoundingClientRect();
    for (let i = 0; i < 7; i++) { const c = document.createElement('div'); c.className = 'chip'; c.style.left = (r.left - o.left + 30) + 'px'; c.style.top = (r.top - o.top + 30) + 'px'; b.appendChild(c);
      const a = rnd() * 6.28, d = 25 + rnd() * 30; requestAnimationFrame(() => { c.style.transform = `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 20}px) rotate(${rnd() * 360}deg)`; c.style.opacity = 0; }); setTimeout(() => c.remove(), 480); }
  }
  function setTotal(v, sub = '', big = false) { $('#total b').innerHTML = v === '' ? '&nbsp;' : fmt(v); $('#total small').textContent = sub; $('#total').classList.toggle('big', big); }
  function tag(rock, text, cls = '') { let t = rock.querySelector('.tag'); if (!t) { t = document.createElement('span'); rock.appendChild(t); } t.className = 'tag ' + cls; t.textContent = text; }

  // ── 몬스터 ──
  function newMob() {
    if (mode === 'boss') return;
    mobMax = mobHp = Math.round(1500 * Math.pow(1.12, kills));
    const m = $('#mob'); m.className = ''; m.src = MOBS[kills % MOBS.length];
    $('#mobName').textContent = `${NAMES[kills % NAMES.length]} Lv.${kills + 1}`; drawHp();
  }
  function drawHp() { $('#field .hp i').style.width = Math.max(0, mobHp / mobMax * 100) + '%'; $('#field .hp b').textContent = `${fmt(Math.max(0, mobHp))} / ${fmt(mobMax)}`; }
  async function hitMob(dmg, big, pierce) {
    const m = $('#mob'); m.classList.add('hit'); setTimeout(() => m.classList.remove('hit'), 90);
    fly($('#field'), (big ? '💥 ' : '-') + fmt(dmg), 150 + (rnd() - .5) * 60, 90, big ? '#ffe066' : null);
    if (mode === 'boss') { mobHp -= dmg; drawHp(); return; }
    let left = dmg, n = 0;
    while (left > 0) {
      const d = Math.min(left, mobHp); mobHp -= d; left -= d; drawHp();
      if (mobHp > 0) break;
      n++; kills++; ore += Math.round(20 * Math.pow(1.1, kills)); snd('break'); m.classList.add('die'); await wait(pierce ? 260 : 380); newMob();
      if (!pierce) break;               // 관통은 황금 광맥만 — 평소엔 남는 피해는 버려짐
    }
    if (n > 1) { stat.pierce += n; fly($('#field'), `${n}마리 관통!`, 120, 150, '#ffd34a'); }
    $('#kills').textContent = `처치 ${kills} · 🪙 ${fmt(ore)}`;
  }

  // ── 바위 그리기 ──
  function rockEl(kind, i) {
    const d = document.createElement('div'); d.className = 'rock drop'; d.style.animationDelay = (i * 60) + 'ms';
    d.innerHTML = `<img class="r" src="${K.stone.img}" alt="">`; d.dataset.kind = kind; return d;
  }
  async function crack(rock, slow) {
    const img = rock.querySelector('img.r');
    for (let s = 1; s <= 3; s++) {
      $('#pick').classList.add('swing'); setTimeout(() => $('#pick').classList.remove('swing'), 80);
      img.src = `assets/blocks/stone_d${s}.png`; rock.classList.remove('shk'); void rock.offsetWidth; rock.classList.add('shk'); snd('hit');
      await wait(slow ? 380 : 85);
    }
    rock.classList.remove('slow'); chips(rock); snd('break');
    const k = rock.dataset.kind; rock.classList.add('open'); img.src = K[k].img;
  }
  // 바위 하나를 깼을 때 효과 (평소·보스 공통). ctx = { mult(다음 칸 배율), sum, golds }
  function apply(rock, ctx, nextRock) {
    const k = rock.dataset.kind, m = ctx.mult; ctx.mult = 1;
    const v = BASE * K[k].v * m; ctx.sum += v;
    if (k === 'tnt') { ctx.mult = m * 2; tag(rock, `다음 ×${ctx.mult}`, 'm'); snd('boom'); shake(5, 200); fx('#ff7a1a', .25, 200); if (nextRock) nextRock.classList.add('x2'); }
    else if (k === 'gem') { tag(rock, `+${fmt(v)}${m > 1 ? ' (×' + m + ')' : ''}`); snd('gem'); fx('#7ff7ff', .2, 200); }
    else if (k === 'gold') { ctx.golds++; rock.classList.add('gold'); tag(rock, `황금 ${ctx.golds}`, 'g'); snd('coin'); }
    else if (k === 'coin') { const o = 30 * m; ore += o; tag(rock, `+🪙${o}`, 'g'); snd('coin'); }
    else tag(rock, `+${fmt(v)}${m > 1 ? ' (×' + m + ')' : ''}`);
    rock.classList.remove('x2');
    setTotal(ctx.sum, `피해 쌓는 중${ctx.golds ? ` · 황금 ${ctx.golds}개` : ''}`);
  }
  async function jackpot(ctx, rocks) {
    const x = JACK[Math.min(ctx.golds, 5)] || 10;
    rocks.filter(r => r.dataset.kind === 'gold').forEach(r => r.classList.add('gold'));
    await wait(250); snd('chestBig'); fx('#ffd34a', .8, 500); shake(14, 450);
    $('#ray').classList.add('on');
    const b = $('#banner'); b.innerHTML = `${ctx.golds >= 5 ? '전설의 ' : ctx.golds >= 4 ? '거대한 ' : ''}황금 광맥!<small>황금 ${ctx.golds}개 → 피해 ×${x}${mode === 'hunt' ? ' · 남는 피해는 다음 몬스터로 관통' : ''}</small>`; b.classList.add('on');
    const from = ctx.sum, to = ctx.sum * x;
    for (let i = 1; i <= 14; i++) { setTotal(from + (to - from) * i / 14, `${fmt(from)} × ${x}`, true); snd('tick'); await wait(45); }
    ctx.sum = to; snd('fanfare'); stat.jack++;
    await wait(700); b.classList.remove('on'); $('#ray').classList.remove('on');
  }

  // ── 평소 사냥: 게이지가 차면 바위판이 내려와 왼쪽부터 자동으로 깸 ──
  async function huntBoard() {
    const g = gen; busy = true;
    const kinds = Array.from({ length: N }, () => rollRock(N));
    const rows = $('#rows'); rows.innerHTML = ''; const row = document.createElement('div'); row.className = 'row'; rows.appendChild(row);
    const rocks = kinds.map((k, i) => { const r = rockEl(k, i); row.appendChild(r); return r; });
    $('#msg').textContent = '곡괭이가 왼쪽부터 깨요'; setTotal(0, ''); snd('stop');
    await wait(420 + N * 60);
    const ctx = { mult: 1, sum: 0, golds: 0 };
    for (let i = 0; i < N; i++) {
      if (g !== gen) return;
      // 마지막 남은 칸이 황금이면 광맥이 되는 순간 → 긴장 연출
      const slow = ctx.golds === 2 && i === N - 1 || ctx.golds >= 2 && ctx.golds + (N - i) >= 3 && i === N - 1;
      if (slow) { $('#board').classList.add('tense'); rocks[i].classList.add('slow'); $('#msg').textContent = '황금 하나만 더…!'; snd('drumroll'); await wait(500); }
      await crack(rocks[i], slow);
      if (slow) $('#msg').textContent = '';
      apply(rocks[i], ctx, rocks[i + 1]);
      $('#board').classList.remove('tense');
      await wait(slow ? 350 : 140);
    }
    if (ctx.golds >= 3) await jackpot(ctx, rocks);
    $('#msg').textContent = ctx.golds >= 3 ? '' : ctx.golds ? `황금 ${ctx.golds}개 (3개부터 광맥)` : '';
    stat.boards++; stat.best = Math.max(stat.best, ctx.sum);
    await wait(250); snd(ctx.golds >= 3 ? 'big' : 'hit');
    await hitMob(ctx.sum, ctx.sum >= BASE * 8, ctx.golds >= 3);
    showStats();
    await wait(700); if (g !== gen) return;
    rows.innerHTML = ''; setTotal('', ''); $('#msg').textContent = '';
    busy = false;
  }
  async function huntLoop() {
    for (;;) {
      await wait(650);
      if (mode !== 'hunt' || busy) continue;
      $('#pick').classList.add('swing'); setTimeout(() => $('#pick').classList.remove('swing'), 90); snd('hit');
      await hitMob(BASE, false, false);
      gauge++; $('#gauge i').style.width = (gauge / 8 * 100) + '%';
      if (gauge >= 8) { gauge = 0; setTimeout(() => $('#gauge i').style.width = '0%', 200); huntBoard(); }
    }
  }

  // ── 보스전: 바위 6개 중 3개를 골라서 깸 (순서도 중요) ──
  let dura = 100, turn = 0, picks = [], bossRocks = [];
  function startBoss() {
    gen++; busy = true; dura = 100; turn = 0;
    mobMax = mobHp = 3000; const m = $('#mob'); m.className = ''; m.src = 'assets/mobs/10000/A0.webp';
    $('#mobName').textContent = '💀 챕터 보스'; drawHp(); drawDura(); bossTurn();
  }
  function drawDura() { $('#dura i').style.width = dura + '%'; $('#dura b').textContent = `곡괭이 내구도 ${dura}`; }
  function bossTurn() {
    turn++; picks = []; setTotal('', '');
    const kinds = Array.from({ length: 6 }, rollBoss);
    const hintIdx = [0, 1, 2, 3, 4, 5].sort(() => rnd() - .5).slice(0, 3);   // 6개 중 3개만 힌트가 보임
    const rows = $('#rows'); rows.innerHTML = ''; bossRocks = [];
    for (let r = 0; r < 2; r++) {
      const row = document.createElement('div'); row.className = 'row'; rows.appendChild(row);
      for (let c = 0; c < 3; c++) {
        const i = r * 3 + c, k = kinds[i], el = rockEl(k, i); el.classList.add('pickable');
        if (hintIdx.includes(i) && K[k].hint) el.insertAdjacentHTML('beforeend', `<span class="hint">${K[k].hint}</span>`);
        else if (hintIdx.includes(i)) el.insertAdjacentHTML('beforeend', `<span class="hint">🪨</span>`);
        el.onclick = () => pickBoss(el); row.appendChild(el); bossRocks.push(el);
      }
    }
    $('#msg').innerHTML = `${turn}번째 공격 · 3개를 골라 깨세요 (힌트: ✨보석 🔥화약 💛황금 🪨돌)`;
    busy = false;
  }
  async function pickBoss(el) {
    if (busy || picks.includes(el) || picks.length >= 3 || mode !== 'boss') return;
    snd('click'); picks.push(el); el.classList.add('picked'); el.classList.remove('pickable');
    el.insertAdjacentHTML('beforeend', `<span class="ord">${picks.length}</span>`);
    el.querySelector('.hint')?.remove();
    if (picks.length < 3) { $('#msg').textContent = `${3 - picks.length}개 더 고르세요 · 고른 순서대로 깨요 (🔥화약은 다음 바위 ×2)`; return; }
    busy = true; const g = gen; $('#msg').textContent = '';
    const ctx = { mult: 1, sum: 0, golds: 0 };
    for (let i = 0; i < 3; i++) {
      const slow = i === 2 && ctx.golds === 2;
      if (slow) { $('#board').classList.add('tense'); picks[i].classList.add('slow'); snd('drumroll'); await wait(500); }
      await crack(picks[i], slow); apply(picks[i], ctx, picks[i + 1]); $('#board').classList.remove('tense'); await wait(220);
      if (g !== gen) return;
    }
    if (ctx.golds === 2) { ctx.sum *= 3; setTotal(ctx.sum, '황금 2개 → ×3', true); snd('big'); fx('#ffd34a', .4); await wait(500); }
    if (ctx.golds >= 3) await jackpot(ctx, picks);
    // 안 고른 바위도 보여 줌 → "저걸 골랐어야 했는데"
    for (const r of bossRocks) if (!picks.includes(r)) { r.classList.add('open', 'miss'); r.querySelector('img.r').src = K[r.dataset.kind].img; r.querySelector('.hint')?.remove(); r.onclick = null; }
    await wait(300); snd('big'); await hitMob(ctx.sum, true, false); stat.best = Math.max(stat.best, ctx.sum); showStats();
    await wait(600); if (g !== gen) return;
    if (mobHp <= 0) return bossEnd(true);
    // 보스 반격
    dura = Math.max(0, dura - 30); drawDura(); snd('boom'); shake(10, 300); fx('#ff2a2a', .35, 300);
    fly($('#field'), '보스 반격 -30', 20, 170, '#ff8a7a');
    await wait(700); if (g !== gen) return;
    if (dura <= 0) return bossEnd(false);
    bossTurn();
  }
  function bossEnd(win) {
    if (win) { stat.bossWin++; $('#mob').classList.add('die'); snd('fanfare'); fx('#ffd34a', .6, 500); }
    else stat.bossLose++;
    $('#rows').innerHTML = ''; setTotal('', '');
    $('#msg').innerHTML = `${win ? `🎉 보스 격파! (${turn}번 만에)` : '💔 곡괭이가 부러졌어요'}<br><button class="btn" id="again">다시 도전</button>`;
    $('#again').onclick = startBoss; showStats();
  }

  // ── 화면 전환 ──
  function showStats() {
    $('#stats').textContent = mode === 'hunt'
      ? `바위판 ${stat.boards}번 · 황금 광맥 ${stat.jack}번 · 관통 ${stat.pierce}마리 · 최고 피해 ${fmt(stat.best)}`
      : `보스 승 ${stat.bossWin} · 패 ${stat.bossLose} · 최고 한 방 ${fmt(stat.best)}`;
  }
  function setMode(m) {
    mode = m; gen++; busy = false; gauge = 0; $('#gauge i').style.width = '0%';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    document.body.classList.toggle('boss', m === 'boss'); $('#app').classList.toggle('boss', m === 'boss');
    $('#opts').style.display = m === 'hunt' ? '' : 'none';
    $('#rows').innerHTML = ''; setTotal('', ''); $('#msg').textContent = ''; $('#board').classList.remove('tense');
    const ic = k => `<img src="${K[k].img}" alt="">`;
    $('#rules').innerHTML = m === 'hunt'
      ? `<b>평소 사냥</b> (손 안 대도 됨)<br>평타 8번 → 게이지가 차면 <b>바위판</b>이 내려오고 곡괭이가 <b>왼쪽부터</b> 깨요.<br>
         ${ic('stone')} 돌 +100 · ${ic('gem')} 보석 +300 · ${ic('tnt')} 화약 = <b>다음 바위 ×2</b> (화약 연속이면 ×4) · ${ic('coin')} 금화 = 광석<br>
         ${ic('gold')} <b>황금 3개 = 황금 광맥!</b> 피해 ×10 (4개 ×30 · 5개 ×100), 남는 피해는 다음 몬스터로 <b>관통</b>.`
      : `<b>보스전</b> (직접 고르기)<br>바위 6개 중 <b>3개를 골라</b> 깨요. 6개 중 3개는 <b>힌트</b>가 보여요.<br>
         <b>고른 순서대로</b> 깨져요 → 🔥화약을 먼저 고르면 다음 바위가 ×2.<br>
         💛황금 2개 = ×3 · 3개 = ×10. 공격이 끝나면 보스가 반격(내구도 -30), 4번째 반격에 곡괭이가 부러져요.`;
    showStats();
    if (m === 'boss') startBoss(); else { $('#mob').className = ''; newMob(); $('#kills').textContent = `처치 ${kills} · 🪙 ${fmt(ore)}`; }
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { snd('click'); setMode(b.dataset.m); });
  document.querySelectorAll('.opts button').forEach(b => b.onclick = () => { N = +b.dataset.n; document.querySelectorAll('.opts button').forEach(x => x.classList.toggle('on', x === b)); });
  document.addEventListener('pointerdown', () => S.unlock && S.unlock(), { once: true });
  // 테스트용: 첫 바위판 내용 강제 (?force=gold,gem,gold,tnt,gold)
  const F = new URLSearchParams(location.search).get('force');
  if (F) FORCE = F.split(',');
  setMode(new URLSearchParams(location.search).get('m') === 'boss' ? 'boss' : 'hunt');
  huntLoop();
})();
</script>
</body>
</html>
