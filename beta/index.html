<!doctype html>
<html lang="ko">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>럭키 디그 (베타)</title>
<link rel="stylesheet" href="beta/css/style.css?v=20261101160150">
</head>
<body>
<div id="bg"></div>

<div id="viewport">
  <div id="app">
    <!-- 상단 -->
    <div id="topbar">
      <div id="logo"><img src="assets/ui/logo.png" alt="LUCKY DIG"><span id="modeBadge">MILD</span></div>
      <button id="pointsPill" class="pill" title="광석">
        <span class="coin"></span>
        <span class="pt-col"><small>보유 광석</small><b id="pointsText">0 pt</b></span>
        <span class="plus">+</span>
      </button>
      <button id="btnRank" class="sidebtn" title="랭킹"><span class="ico">🏆</span><small>랭킹</small></button>
      <button id="btnMenu" class="sidebtn" title="메뉴"><span class="ico">☰</span><small>메뉴</small></button>
    </div>

    <div id="middle">
      <div id="stage">
        <div id="slot"></div>
        <div id="board"></div>
        <div id="fx"></div>
      </div>
      <div id="rightcol">
        <button id="btnHelp" class="sidebtn" title="플레이 방법"><span class="ico">?</span><small>플레이 방법</small></button>
        <button id="btnPrizes" class="sidebtn" title="상품 목록"><span class="ico">🂠</span><small>상품</small></button>
        <button id="btnBag" class="sidebtn" title="보관함"><span class="ico">🎒</span><small>카드·도감</small></button>
        <div id="monster" hidden>
          <div class="mon-img"><img id="monImg" alt=""><span id="monGrade" class="chip">F</span></div>
          <b id="monName">몬스터</b>
          <div class="mon-hp"><div id="monHpFill"></div></div>
          <small id="monHpText">0</small>
          <div class="mon-atk" id="monAtkBox"><span>⚔ 공격까지</span><b id="monAtk">3</b></div>
        </div>
        <div id="gauge">
          <div id="gaugeTrack"><div id="gaugeFill"></div></div>
          <div id="gaugeLabels"></div>
        </div>
        <button id="btnSpeed" class="speedbtn" title="고속">⚡</button>
      </div>
    </div>

    <div id="chests"></div>

    <div id="panel">
      <div id="panelIdle">
        <button id="betMinus" class="roundbtn minus">−</button>
        <button id="betBox"><small id="betSub">광산</small><b id="betText">풀숲 입구</b></button>
        <button id="betPlus" class="roundbtn plus">+</button>
        <button id="btnPlay"><span class="tri"></span><small>탐험</small></button>
      </div>
      <div id="panelPlay" hidden>
        <div class="info">
          <div><small>층</small><b id="playBet">1층</b></div>
          <div><small>하트</small><b id="heartText">❤❤❤</b></div>
          <div class="hide-spins"><small>남은 스핀</small><b id="spinsText">0회</b></div>
          <div><small>리롤</small><b id="rerollText">0회</b></div>
        </div>
        <div class="scorebox"><small>대미지</small><b id="scoreText">0</b></div>
      </div>
      <div id="spinActions" hidden>
        <div id="holdHint">열을 눌러 고정(홀드)한 뒤 리롤할 수 있어요</div>
        <div class="sa-btns"><button id="btnReroll">🔄 리롤</button><button id="btnConfirm">✔ 이대로 캐기</button></div>
      </div>
    </div>
    <div id="toast"></div>
  </div>
</div>

<div id="title">
  <div class="title-glow"></div>
  <img class="title-logo" src="assets/ui/logo.png" alt="LUCKY DIG">
  <div class="mode-select">
    <button class="mode-btn" data-mode="mild"><b>MILD</b><span class="meter"><i></i><i></i><i></i><i></i><i></i></span><small>오래 즐기는 안정형<br>본전 근처가 자주 나와요</small></button>
    <button class="mode-btn" data-mode="hard"><b>HARD</b><span class="meter"><i></i><i></i><i></i><i></i><i></i></span><small>한 방을 노리는 승부형<br>S·A상이 약 2배 자주</small></button>
  </div>
  <button id="btnStart"><span>GAME START</span></button>
  <button id="btnWho" class="who"></button>
  <div class="title-hint">화면을 눌러 시작하세요</div>
  <div class="title-sparkles"></div>
</div>

<div id="news"></div>
<div id="overlay" hidden></div>

<script src="beta/js/config.js?v=20261101160150"></script>
<script src="beta/js/engine.js?v=20261101160150"></script>
<script src="beta/js/relics.js?v=20261101160150"></script>
<script src="beta/js/dig.js?v=20261101160150"></script>
<script src="beta/js/sound.js?v=20261101160150"></script>
<script src="beta/js/art.js?v=20261101160150"></script>
<script src="beta/js/render.js?v=20261101160150"></script>
<script src="beta/js/online-config.js?v=20261101160150"></script>
<script src="beta/js/rank.js?v=20261101160150"></script>
<script src="beta/js/run.js?v=20261101160150"></script>
<script src="beta/js/ui.js?v=20261101160150"></script>
<script>if (location.hash.includes('picktest')) addEventListener('load', () => { const s = document.createElement('script'); s.src = 'beta/js/picktest.js?v=20261101160150'; document.body.appendChild(s); });</script>
<script>if (/#fx\d+/.test(location.hash)) addEventListener('load', () => { const s = document.createElement('script'); s.src = 'beta/js/fxtest.js?v=20261101160150'; document.body.appendChild(s); });</script>
<script>if (location.hash.includes('uitest') && location.protocol === 'file:') addEventListener('load', () => { const s = document.createElement('script'); s.src = 'beta/js/uitest.js?v=20261101160150'; document.body.appendChild(s); });</script>
</body>
</html>
